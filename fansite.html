    <style>
        /* 自定义CSS变量和过渡 */
        :root {
            --transition-duration: 0.3s;
        }
        
        /* 主题过渡效果 */
        * {
            transition: background-color var(--transition-duration) ease,
                        color var(--transition-duration) ease,
                        border-color var(--transition-duration) ease,
                        box-shadow var(--transition-duration) ease;
        }
        
        /* 爱心动画容器 */
        #hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        
        /* 爱心样式 */
        .heart {
            position: absolute;
            animation: fall linear infinite;
            pointer-events: none;
        }
        
        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* 主题切换按钮动画 */
        .theme-toggle {
            transition: transform 0.5s ease;
        }
        
        .theme-toggle:hover {
            transform: rotate(180deg);
        }
        
        /* 应援按钮脉冲效果 */
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        
        .support-btn:hover {
            animation: pulse 1s ease-in-out infinite;
        }
        
        /* 计数器动画 */
        @keyframes countUp {
            from {
                transform: scale(1.2);
                color: #ec4899;
            }
            to {
                transform: scale(1);
            }
        }
        
        .count-animate {
            animation: countUp 0.3s ease-out;
        }
        
        /* 渐变文字 */
        .gradient-text {
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* 卡片悬浮效果 */
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }
        
        /* 深色主题背景图案 */
        .dark-pattern {
            background-image: radial-gradient(circle at 25% 25%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                              radial-gradient(circle at 75% 75%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
        }
        
        /* 浅色主题背景图案 */
        .light-pattern {
            background-image: radial-gradient(circle at 25% 25%, rgba(139, 92, 246, 0.05) 0%, transparent 50%),
                              radial-gradient(circle at 75% 75%, rgba(236, 72, 153, 0.05) 0%, transparent 50%);
        }
    </style>
    <!-- Tailwind 配置 -->

    <script>
        // ==================== 主题切换功能 ====================
        /**
         * 初始化主题设置
         * 从localStorage读取用户偏好，如果没有则使用系统偏好
         */
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        /**
         * 切换主题
         * 在浅色和深色主题之间切换，并保存到localStorage
         */
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            
            if (isDark) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        // 绑定主题切换按钮事件
        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

        // 页面加载时初始化主题
        initTheme();

        // ==================== 爱心动画功能 ====================
        const heartsContainer = document.getElementById('hearts-container');
        const maxHearts = 50; // 最大爱心数量，控制性能
        let heartCount = 0;

        /**
         * 创建单个爱心元素
         * @returns {HTMLElement} 爱心DOM元素
         */
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            
            // 随机大小 (10px - 30px)
            const size = Math.random() * 20 + 10;
            heart.style.width = `${size}px`;
            heart.style.height = `${size}px`;
            
            // 随机水平位置
            heart.style.left = `${Math.random() * 100}%`;
            
            // 随机透明度 (0.3 - 0.8)
            heart.style.opacity = Math.random() * 0.5 + 0.3;
            
            // 随机下落速度 (3s - 8s)
            const duration = Math.random() * 5 + 3;
            heart.style.animationDuration = `${duration}s`;
            
            // 随机颜色 (粉色系)
            const colors = [
                '#ec4899', // pink-500
                '#f472b6', // pink-400
                '#db2777', // pink-600
                '#a855f7', // purple-500
                '#c084fc', // purple-400
            ];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            // 使用SVG绘制爱心
            heart.innerHTML = `
                <svg viewBox="0 0 24 24" fill="${color}" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            `;
            
            return heart;
        }

        /**
         * 持续生成爱心动画
         * 使用requestAnimationFrame优化性能
         */
        function animateHearts() {
            if (heartCount < maxHearts) {
                const heart = createHeart();
                heartsContainer.appendChild(heart);
                heartCount++;
                
                // 动画结束后移除爱心并减少计数
                heart.addEventListener('animationend', () => {
                    heart.remove();
                    heartCount--;
                });
            }
            
            // 随机间隔生成新爱心 (100ms - 300ms)
            setTimeout(animateHearts, Math.random() * 200 + 100);
        }

        // 启动爱心动画
        animateHearts();

        // ==================== 应援计数器功能 ====================
        // 从localStorage读取计数，如果没有则初始化为0
        let loveCount = parseInt(localStorage.getItem('loveCount')) || 0;
        let starCount = parseInt(localStorage.getItem('starCount')) || 0;
        let cheerCount = parseInt(localStorage.getItem('cheerCount')) || 0;

        /**
         * 更新显示的计数
         */
        function updateCountDisplay() {
            document.getElementById('love-count').textContent = loveCount;
            document.getElementById('star-count').textContent = starCount;
            document.getElementById('cheer-count').textContent = cheerCount;
        }

        // 初始化显示
        updateCountDisplay();

        /**
         * 增加爱心计数
         */
        function addLove() {
            loveCount++;
            localStorage.setItem('loveCount', loveCount);
            const element = document.getElementById('love-count');
            element.textContent = loveCount;
            element.classList.add('count-animate');
            setTimeout(() => element.classList.remove('count-animate'), 300);
            
            // 添加额外爱心动画效果
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const heart = createHeart();
                    heartsContainer.appendChild(heart);
                    heartCount++;
                    heart.addEventListener('animationend', () => {
                        heart.remove();
                        heartCount--;
                    });
                }, i * 100);
            }
        }

        /**
         * 增加星星计数
         */
        function addStar() {
            starCount++;
            localStorage.setItem('starCount', starCount);
            const element = document.getElementById('star-count');
            element.textContent = starCount;
            element.classList.add('count-animate');
            setTimeout(() => element.classList.remove('count-animate'), 300);
        }

        /**
         * 增加欢呼计数
         */
        function addCheer() {
            cheerCount++;
            localStorage.setItem('cheerCount', cheerCount);
            const element = document.getElementById('cheer-count');
            element.textContent = cheerCount;
            element.classList.add('count-animate');
            setTimeout(() => element.classList.remove('count-animate'), 300);
        }

        // ==================== 粉丝数和作品数动画 ====================
        /**
         * 数字递增动画
         * @param {HTMLElement} element - 目标元素
         * @param {number} target - 目标数值
         * @param {number} duration - 动画持续时间
         */
        function animateNumber(element, target, duration) {
            const start = 0;
            const startTime = performance.now();
            
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // 使用缓动函数
                const easeOutQuart = 1 - Math.pow(1 - progress, 4);
                const current = Math.floor(start + (target - start) * easeOutQuart);
                
                element.textContent = current.toLocaleString();
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            
            requestAnimationFrame(update);
        }

        // 页面加载时启动数字动画
        window.addEventListener('load', () => {
            setTimeout(() => {
                animateNumber(document.getElementById('fans-count'), 128547, 2000);
                animateNumber(document.getElementById('works-count'), 256, 2000);
            }, 500);
        });

        // ==================== 应援口号功能 ====================
        /**
         * 显示应援口号提示
         */
        function shoutSlogan() {
            // 创建提示元素
            const toast = document.createElement('div');
            toast.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-gradient-to-r from-pink-500 to-purple-600 text-white px-8 py-4 rounded-2xl shadow-2xl z-50 text-xl font-bold';
            toast.textContent = '📣 光耀四方，闪耀如星！蔡光耀，我们永远支持你！';
            document.body.appendChild(toast);
            
            // 添加额外爱心
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const heart = createHeart();
                    heartsContainer.appendChild(heart);
                    heartCount++;
                    heart.addEventListener('animationend', () => {
                        heart.remove();
                        heartCount--;
                    });
                }, i * 50);
            }
            
            // 2秒后移除提示
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 2000);
        }

        // ==================== 留言板功能 ====================
        // 从localStorage读取留言
        let messages = JSON.parse(localStorage.getItem('fanMessages')) || [];

        /**
         * 渲染留言列表
         */
        function renderMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            
            messages.slice(-10).reverse().forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'bg-gray-50 dark:bg-gray-700 rounded-lg p-4';
                messageDiv.innerHTML = `
                    <p class="text-gray-800 dark:text-gray-200">${escapeHtml(msg.text)}</p>
                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">${msg.time}</p>
                `;
                container.appendChild(messageDiv);
            });
        }

        /**
         * 转义HTML特殊字符，防止XSS攻击
         * @param {string} text - 需要转义的文本
         * @returns {string} 转义后的文本
         */
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        /**
         * 添加新留言
         */
        function addMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            
            if (!text) {
                alert('请输入留言内容');
                return;
            }
            
            const message = {
                text: text,
                time: new Date().toLocaleString('zh-CN')
            };
            
            messages.push(message);
            localStorage.setItem('fanMessages', JSON.stringify(messages));
            
            input.value = '';
            renderMessages();
        }

        // 初始化留言显示
        renderMessages();

        // ==================== 平滑滚动功能 ====================
        /**
         * 滚动到指定区域
         * @param {string} sectionId - 区域ID
         */
        function scrollToSection(sectionId) {
            const element = document.getElementById(sectionId);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // ==================== 性能优化 ====================
        // 当页面不可见时暂停动画
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                heartsContainer.style.display = 'none';
            } else {
                heartsContainer.style.display = 'block';
            }
        });

        // 响应式处理：移动端减少爱心数量
        if (window.innerWidth < 768) {
            maxHearts = 30;
        }

        // 窗口大小改变时调整
        window.addEventListener('resize', () => {
            if (window.innerWidth < 768) {
                maxHearts = 30;
            } else {
                maxHearts = 50;
            }
        });
    </script>
</body>
</html>
